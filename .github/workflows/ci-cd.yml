name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: php -l out/api/request.php
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: out

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.REG_SSH_KEY }}
          SSH_HOST: ${{ secrets.REG_HOST }}
          SSH_PORT: ${{ secrets.REG_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to REG.RU Host-A
        env:
          SSH_HOST: ${{ secrets.REG_HOST }}
          SSH_PORT: ${{ secrets.REG_SSH_PORT }}
          SSH_USER: ${{ secrets.REG_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.REG_DEPLOY_PATH }}
        run: |
          case "$DEPLOY_PATH" in ""|"/"|"."|"~") echo "Unsafe REG_DEPLOY_PATH"; exit 1;; esac
          port="${SSH_PORT:-22}"
          ssh -p "$port" "$SSH_USER@$SSH_HOST" "test -d '$DEPLOY_PATH'"
          rsync -az --delete --exclude='.well-known/' -e "ssh -p $port" out/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
